<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071f2a" />
    <meta name="description" content="Ahmed Alaa، مدير مخازن وخدمات لوجستية بخبرة تتجاوز 10 سنوات عبر 5+ مواقع. SAP MM / EWM / SD، تحليل البيانات، أتمتة التقارير ورقمنة المخازن." />
    <title>Ahmed Alaa | مدير مخازن وخدمات لوجستية</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=p04-name" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon-180.png" />
    <link id="portfolio-manifest" rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ahmed Alaa" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      (() => {
        const current = new URL(location.href);
        const target = new URL('./owner-app.html', current);
        const flag = current.searchParams.get('aa_no_track');
        let owner = flag === '1';
        try { owner ||= flag !== '0' && localStorage.getItem('aa-owner-entry') === '1'; } catch {}
        if (owner && current.pathname !== target.pathname) {
          target.hash = current.hash || '#top';
          location.replace(target.href);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--portfolio--></div>
    <script type="module" src="./main.tsx"></script>
  </body>
